<!doctype html>
<meta charset="utf-8">
<title>Content Bot Disabled for Midterm</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --w: 720px; }
  body { font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 0; }
  .wrap { max-width: var(--w); margin: 0 auto; padding: 2.5rem 1.25rem; }
  h1 { font-size: 1.75rem; margin: 0 0 0.75rem; }
  .notice { background: #fff3cd; border: 1px solid #ffe08a; padding: 1rem; border-radius: 12px; }
  .muted { color: #555; }
</style>

<div class="wrap">
  <h1>Content Bot Unavailable</h1>
  <p class="notice">
    The course content bot is <strong>disabled during the midterm exam</strong>.
    The midterm begins at <strong>6:00 p.m. sharp</strong>
    <span class="muted">(Eastern Time)</span>. The bot will return after the exam window closes.
  </p>

  <p class="muted">If you’re seeing this outside the exam window, please try again in a few minutes or refresh the page.</p>
</div>
